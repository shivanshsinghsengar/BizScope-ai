<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)"/>

  <!-- Scope/lens ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Crosshair lines -->
  <line x1="100" y1="28" x2="100" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="150" x2="100" y2="172" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="100" x2="50" y2="100" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="100" x2="172" y2="100" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>

  <!-- Letter S -->
  <text x="100" y="118" font-family="Arial Black, sans-serif" font-size="72" font-weight="900"
    fill="white" text-anchor="middle" dominant-baseline="middle">S</text>
</svg>
