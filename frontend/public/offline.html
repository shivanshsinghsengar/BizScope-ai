<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — BizScope AI</title>
  <style>
    body { background: #0b0e14; color: #f3f4f6; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 24px; }
    .card { background: #151921; border: 1px solid #1e2535; border-radius: 20px; padding: 40px; max-width: 400px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
    p { color: #9ca3af; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
    button { background: linear-gradient(135deg,#3b82f6,#2563eb); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:48px;margin-bottom:16px">📡</div>
    <h1>You're offline</h1>
    <p>BizScope AI needs internet to fetch live business data. Connect to WiFi or mobile data and try again.</p>
    <button onclick="window.location.reload()">🔄 Try Again</button>
  </div>
</body>
</html>
